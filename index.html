<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳陽婷 | 個人網站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        vibrant: {
                            pink: '#ff4b8b',
                            purple: '#8b5cf6',
                            cyan: '#06b6d4',
                            yellow: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .vibrant-bg {
            background: linear-gradient(135deg, #fff5f8 0%, #f0f4ff 50%, #eefcfd 100%);
        }
        .vibrant-gradient-text {
            background: linear-gradient(135deg, #ff4b8b 0%, #8b5cf6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .vibrant-gradient-bg {
            background: linear-gradient(135deg, #ff4b8b 0%, #8b5cf6 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body class="vibrant-bg text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- 主卡片容器 -->
    <div class="max-w-4xl w-full glass-card rounded-3xl shadow-2xl shadow-purple-500/10 p-6 md:p-10 transition-all duration-300">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            
            <!-- 左側：照片區域 (Photo Section) -->
            <div class="md:col-span-5 flex flex-col items-center">
                <div class="relative group w-48 h-64 md:w-56 md:h-72 rounded-2xl overflow-hidden shadow-xl p-1 bg-gradient-to-tr from-vibrant-pink via-vibrant-purple to-vibrant-cyan hover:scale-[1.02] transition-all duration-300">
                    <div class="w-full h-full rounded-[14px] overflow-hidden bg-white relative">
                        <!-- 個人照片位置：請替換 src 為您的照片連結或 profile.jpg -->
                        <img id="profile-img" 
                             src="https://placehold.co/400x520/fff0f5/ff4b8b?text=%E9%99%B3%E9%99%BD%E5%A9%B7" 
                             alt="陳陽婷" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                             onerror="this.src='https://placehold.co/400x520/fff0f5/ff4b8b?text=%E9%99%B3%E9%99%BD%E5%A9%B7'">
                    </div>
                </div>
                <p class="text-xs text-slate-400 mt-3 font-medium flex items-center gap-1">
                    <i class="fa-regular fa-image"></i> 個人照片展區
                </p>
            </div>

            <!-- 右側：精簡個人資訊 -->
            <div class="md:col-span-7 space-y-6 text-center md:text-left">
                
                <!-- 標題與簡介 -->
                <div>
                    <div class="inline-block px-3 py-1 rounded-full bg-pink-100 text-vibrant-pink text-xs font-bold tracking-wide mb-3">
                        黎明技術學院 數位多媒體系
                    </div>
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 mb-2">
                        陳陽婷 <span class="text-lg md:text-xl font-normal text-slate-500">Yang-Ting</span>
                    </h1>
                    <p class="text-slate-600 text-sm md:text-base font-medium italic">
                        ✨「喜歡簡單生活，也喜歡認真對待每一件事。」
                    </p>
                </div>

                <!-- 技能與興趣 (極簡標籤) -->
                <div class="space-y-3">
                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">專業技能</span>
                        <div class="flex flex-wrap justify-center md:justify-start gap-2">
                            <span class="px-3 py-1.5 rounded-xl bg-purple-50 text-vibrant-purple border border-purple-100 text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-code"></i> 寫代碼
                            </span>
                            <span class="px-3 py-1.5 rounded-xl bg-cyan-50 text-vibrant-cyan border border-cyan-100 text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-square-root-variable"></i> 微積分
                            </span>
                        </div>
                    </div>

                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">興趣愛好</span>
                        <div class="flex flex-wrap justify-center md:justify-start gap-2">
                            <span class="px-3 py-1.5 rounded-xl bg-amber-50 text-vibrant-yellow border border-amber-100 text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-headphones"></i> 聽音樂
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 社群與聯繫按鈕群 -->
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">快速聯繫</span>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <button onclick="copyText('bd1151024@venus.lit.edu.tw', 'Email')" class="px-3 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 hover:-translate-y-0.5">
                            <i class="fa-regular fa-envelope text-vibrant-pink"></i> 複製 Email
                        </button>
                        
                        <button onclick="copyText('0961014946', 'Line ID')" class="px-3 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 hover:-translate-y-0.5">
                            <i class="fa-brands fa-line text-emerald-500"></i> 複製 Line ID
                        </button>

                        <a href="https://www.instagram.com/_bxng_eieii_/" target="_blank" rel="noopener noreferrer" class="px-3 py-2.5 rounded-xl vibrant-gradient-bg text-white text-xs font-bold transition-all shadow-md shadow-pink-500/20 flex items-center justify-center gap-1.5 hover:-translate-y-0.5">
                            <i class="fa-brands fa-instagram"></i> Instagram
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Toast 浮動提示 -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-16 opacity-0 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-sparkles text-vibrant-pink"></i>
        <span id="toast-msg">已成功複製！</span>
    </div>

    <script>
        function copyText(text, label) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(`已成功複製 ${label}！`);
            } catch (err) {
                showToast('複製失敗');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
